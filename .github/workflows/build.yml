# Installateurs Windows, Linux et Mac compiles par GitHub (machines virtuelles).
# - A la main (onglet Actions, « Run workflow ») : installateurs en artefacts
#   du workflow, rien n'est publie.
# - Par un tag v* (git tag v0.2.1 && git push --tags, voir docs/PUBLIER.md) :
#   meme build, puis release publique vX.Y.Z dans Maxencedlff/cahiers-releases
#   avec latest.json, lu par le bouton « Mettre a jour » de l'appli.
# - Job « mas » (meme declencheurs) : version Mac App Store, sandboxee, sans
#   updater, .pkg signe envoye sur App Store Connect (docs/PUBLIER.md).
# Un build Mac compte 10 fois sur le quota de minutes d'un depot prive.
name: Installateurs
on:
  workflow_dispatch:
    inputs:
      cible:
        description: "tout = installateurs + Mac App Store ; mas = Mac App Store seul"
        type: choice
        options: [tout, mas]
        default: tout
  push:
    tags: ["v*"]

# GITHUB_TOKEN en lecture seule partout : la release passe par RELEASES_TOKEN
# (depot cahiers-releases), l'envoi Mac App Store par la cle d'API Apple.
permissions:
  contents: read

jobs:
  # Tag : les trois numeros de version (package.json, tauri.conf.json,
  # Cargo.toml) doivent etre ceux du tag, avant de payer un build Mac.
  version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      # Pre-versions (v0.3.0-beta.1, v1.0.0+x) refusees : masBuildNumber ne
      # sait pas les numeroter (le job mas casserait apres la release), et
      # une installation beta ne verrait jamais la version finale (isNewer).
      # Voir docs/PUBLIER.md.
      - name: Pas de pre-version
        run: |
          case "$GITHUB_REF_NAME" in
            *-*|*+*)
              echo "::error::Tag « $GITHUB_REF_NAME » : les pre-versions ne sont pas gerees, utiliser vX.Y.Z (docs/PUBLIER.md)."
              exit 1 ;;
          esac
      - run: node --experimental-strip-types scripts/release.ts check "$GITHUB_REF_NAME"

  # Tests (ci.yml, version complete : tsc, vitest, npm audit, cargo test
  # Windows et macOS, avec et sans app-store). Rien n'est construit, publie
  # ni envoye a Apple si un test est rouge. Aucun secret transmis.
  test:
    uses: ./.github/workflows/ci.yml
    with:
      complet: true

  build:
    needs: [version, test]
    # Lancement a la main : « version » est sautee, le build part quand meme
    # (sauf « Mac App Store seul »), mais jamais si « test » a echoue.
    # Tag : `inputs.cible` est vide.
    if: ${{ !failure() && !cancelled() && inputs.cible != 'mas' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: ubuntu-22.04
            name: linux
          - os: macos-latest
            name: mac
    runs-on: ${{ matrix.os }}
    # Les secrets ne sont declares que dans les etapes `tauri build` : ni les
    # actions tierces, ni les scripts d'installation npm ne les voient.
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Mac : une seule appli pour les puces Apple et Intel.
          targets: ${{ matrix.name == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
      - name: Paquets systeme (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Signature des mises a jour (bundle.createUpdaterArtifacts) : sans
      # elle, `tauri build` s'arrete. Cle privee : ~/.config/cahiers-updater.
      - name: Build (Windows, Linux)
        if: matrix.name != 'mac'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build ${{ matrix.name == 'linux' && '--bundles deb,appimage' || '' }}
      # Mac : signe avec le certificat Developer ID et notarise par Apple
      # (secrets du depot), sinon macOS refuse d'ouvrir l'appli telechargee.
      - name: Build signe et notarise (Mac)
        if: matrix.name == 'mac'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        # La cle .p8 passe par l'environnement, jamais recopiee dans le
        # script genere ; fichier supprime a la fin, meme en cas d'echec.
        run: |
          set -euo pipefail
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          trap 'rm -f "$APPLE_API_KEY_PATH"' EXIT
          (umask 077 && printf '%s\n' "$APPLE_API_KEY_P8" > "$APPLE_API_KEY_PATH")
          npx tauri build --target universal-apple-darwin --bundles app,dmg
      # Installateurs + artefacts du updater (.sig, Cahiers.app.tar.gz).
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cahiers-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/**/*.exe
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.deb
            src-tauri/target/release/bundle/**/*.AppImage
            src-tauri/target/release/bundle/**/*.rpm
            src-tauri/target/release/bundle/**/*.sig
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/**/*.sig
          if-no-files-found: warn

  # Tag seulement, et seulement si les trois builds ont reussi : jamais une
  # release a moitie (l'appli installee lirait un latest.json incomplet).
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artefacts
      - name: Fichiers a publier et latest.json
        run: node --experimental-strip-types scripts/release.ts plan "$GITHUB_REF_NAME" artefacts publier
      # Depot public : le jeton RELEASES_TOKEN peut y publier (jeton
      # fine-grained limite a cahiers-releases, voir docs/PUBLIER.md). gh cree
      # la release en brouillon, envoie les fichiers, puis la publie : le
      # latest.json « latest » ne pointe jamais vers une release incomplete.
      - name: Release dans Maxencedlff/cahiers-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" publier/* \
            -R Maxencedlff/cahiers-releases \
            --title "Cahiers $v" \
            --latest \
            --notes "Cahiers $v.

          Installer : Windows \`Cahiers_${v}_x64-setup.exe\`, Mac \`Cahiers_${v}_universal.dmg\`, Linux \`.AppImage\` ou \`.deb\`.
          Déjà installé : l'appli propose « Mettre à jour » toute seule (ou menu ⋯ › Rechercher des mises à jour)."

  # Mac App Store (doc Tauri v2 « App Store ») : a cote du .dmg Developer ID,
  # qui ne change pas. Tag v* (apres le job « version ») ou lancement a la
  # main. Ne bloque ni « build » ni « release ». Jamais si « test » a echoue.
  # - config fusionnee : src-tauri/tauri.appstore.conf.json (sandbox,
  #   entitlements, profil embarque, pas d'updater) + feature Cargo app-store ;
  # - signe « Apple Distribution », .pkg signe « 3rd Party Mac Developer
  #   Installer », verifie, puis envoye sur App Store Connect (TestFlight).
  mas:
    needs: [version, test]
    if: ${{ !failure() && !cancelled() }}
    runs-on: macos-latest
    env:
      APP_SIGNING_IDENTITY: "Apple Distribution: Maxence de La Fouchardiere (NMK739Z59B)"
      INSTALLER_SIGNING_IDENTITY: "3rd Party Mac Developer Installer: Maxence de La Fouchardiere (NMK739Z59B)"
      # Fiche App Store Connect « Cahiers » (fr.mdlf.cahiers).
      ASC_APP_ID: "6824238306"
      BUNDLE_ID: fr.mdlf.cahiers
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: mas
      - run: npm ci
      # Trousseau temporaire : les deux certificats (appli + installeur), plus
      # les intermediaires Apple WWDR G3 pour une chaine complete.
      - name: Certificats (trousseau temporaire)
        env:
          MAS_CERTIFICATE: ${{ secrets.MAS_CERTIFICATE }}
          MAS_CERTIFICATE_PASSWORD: ${{ secrets.MAS_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERTIFICATE: ${{ secrets.MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/mas.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$kc"
          echo "$MAS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/app.p12"
          echo "$MAS_INSTALLER_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/app.p12" -k "$kc" -P "$MAS_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$MAS_INSTALLER_CERTIFICATE_PASSWORD" -f pkcs12 \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/app.p12" "$RUNNER_TEMP/installer.p12"
          curl -fsSL -o "$RUNNER_TEMP/wwdr.cer" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdr.cer" -k "$kc" || true
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -F "$APP_SIGNING_IDENTITY"
          security find-identity -v "$kc" | grep -F "$INSTALLER_SIGNING_IDENTITY"
      - name: Profil de provisioning
        env:
          MAS_PROVISION_PROFILE: ${{ secrets.MAS_PROVISION_PROFILE }}
        run: echo "$MAS_PROVISION_PROFILE" | base64 --decode > src-tauri/appstore/embedded.provisionprofile
      # CFBundleVersion unique et croissant a chaque envoi (src/core/release.ts).
      - name: Numero de build
        id: num
        run: |
          echo "build=$(node --experimental-strip-types scripts/release.ts mas-build "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./src-tauri/tauri.conf.json').version")" >> "$GITHUB_OUTPUT"
      # Pas de variables APPLE_API_* ici : Tauri ne notarise pas (inutile et
      # refuse pour une signature Apple Distribution).
      - name: Build Mac App Store (signe Apple Distribution)
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APP_SIGNING_IDENTITY }}
        run: |
          npx tauri build --target universal-apple-darwin --bundles app --features app-store \
            --config src-tauri/tauri.appstore.conf.json \
            --config '{"bundle":{"macOS":{"bundleVersion":"${{ steps.num.outputs.build }}"}}}'
      - name: Paquet .pkg signe
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Cahiers.app"
          mkdir -p mas
          xcrun productbuild --sign "$INSTALLER_SIGNING_IDENTITY" --component "$app" /Applications mas/Cahiers.pkg
      - name: Verifications (signatures, entitlements, profil, Info.plist, pas d'updater)
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/Cahiers.app"
          # Guideline 2.4.5(vii) : aucune mise a jour par l'appli. La config
          # embarquee dans le binaire ne doit contenir ni l'adresse de
          # cahiers-releases ni la cle publique de l'updater (presentes dans
          # le binaire du .dmg Developer ID, absentes si plugins.updater est
          # bien null). Temoin : l'identifiant, lui, doit y etre, sinon la
          # recherche ne prouverait rien.
          bin="$app/Contents/MacOS/cahiers"
          pubkey="$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")"
          LC_ALL=C grep -a -q -F "$BUNDLE_ID" "$bin"
          if LC_ALL=C grep -a -q -F -e "cahiers-releases" -e "$pubkey" "$bin"; then
            echo "::error::La build Mac App Store embarque la config de l'updater (cahiers-releases ou pubkey)."
            exit 1
          fi
          if find src-tauri/target/universal-apple-darwin/release/bundle -name '*.app.tar.gz' -o -name '*.sig' | grep -q .; then
            echo "::error::La build Mac App Store a produit des artefacts de mise a jour (.app.tar.gz, .sig)."
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dvv --entitlements - "$app" 2>&1 | tee mas/codesign.txt
          grep -F "Authority=Apple Distribution" mas/codesign.txt
          grep -F "com.apple.security.app-sandbox" mas/codesign.txt
          grep -F "com.apple.security.files.bookmarks.app-scope" mas/codesign.txt
          grep -F "NMK739Z59B.fr.mdlf.cahiers" mas/codesign.txt
          test -f "$app/Contents/embedded.provisionprofile"
          plist="$app/Contents/Info.plist"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "${{ steps.num.outputs.build }}"
          test "$(/usr/libexec/PlistBuddy -c 'Print :ITSAppUsesNonExemptEncryption' "$plist")" = "false"
          /usr/libexec/PlistBuddy -c 'Print :LSApplicationCategoryType' "$plist"
          lipo -archs "$app/Contents/MacOS/cahiers"
          pkgutil --check-signature mas/Cahiers.pkg | tee mas/pkgutil.txt
          grep -F "3rd Party Mac Developer Installer" mas/pkgutil.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cahiers-mas
          path: mas/
      # Envoi sur App Store Connect avec la cle d'API (celle de la
      # notarisation). altool la cherche dans ~/.appstoreconnect/private_keys.
      - name: Envoi sur App Store Connect
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$APPLE_API_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_${APPLE_API_KEY}.p8
          xcrun altool --upload-package mas/Cahiers.pkg --type macos \
            --apple-id "$ASC_APP_ID" --bundle-id "$BUNDLE_ID" \
            --bundle-version "${{ steps.num.outputs.build }}" \
            --bundle-short-version-string "${{ steps.num.outputs.version }}" \
            --apiKey "$APPLE_API_KEY" --apiIssuer "$APPLE_API_ISSUER" \
            --output-format normal
      - name: Nettoyage du trousseau
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/mas.keychain-db" || true
