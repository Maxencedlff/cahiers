# Essai a la main (Actions, « Essai impression Mac », Run workflow) ou a
# chaque envoi sur une branche fix-impression-* : la
# boite d'impression (export PDF) s'ouvre-t-elle sur un vrai Mac ?
# Build de debug, lancee sur la machine de GitHub ; CAHIERS_TEST_EVAL lance
# l'impression 15 s apres le demarrage (lib.rs, debug seulement), puis
# capture d'ecran et liste des fenetres. Deux chemins compares :
#  - « nouveau » : window.print de l'appli (commande print_page, print.rs) ;
#  - « ancien » : l'impression de Tauri (plugin:webview|print, wry).
# Chacun en build directe et en build sandboxee (feature app-store, signee
# ad hoc avec la sandbox et l'entitlement print, comme l'App Store).
name: Essai impression Mac
on:
  workflow_dispatch:
  # Un workflow manuel n'apparait qu'une fois sur main : d'ici la, il part a
  # chaque envoi sur une branche de correction d'impression.
  push:
    branches: ["fix-impression-*"]

permissions:
  contents: read

jobs:
  impression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: mac-impression
      - name: Builds de debug (directe, sandboxee)
        run: |
          npx tauri build --debug --no-bundle
          cp src-tauri/target/debug/cahiers cahiers-direct
          npx tauri build --debug --no-bundle --features app-store
          cp src-tauri/target/debug/cahiers cahiers-sandbox
          cat > sandbox.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>com.apple.security.app-sandbox</key><true/>
          <key>com.apple.security.files.user-selected.read-write</key><true/>
          <key>com.apple.security.network.client</key><true/>
          <key>com.apple.security.print</key><true/>
          </dict></plist>
          PLIST
          codesign --force -s - --entitlements sandbox.plist cahiers-sandbox
      - name: Essais
        run: |
          sw_vers | tee resultats.txt
          mkdir -p essais
          for build in direct sandbox; do
            for chemin in nouveau ancien; do
              if [ "$chemin" = nouveau ]; then js='window.print()'
              else js="window.__TAURI_INTERNALS__.invoke('plugin:webview|print')"; fi
              nom="$build-$chemin"
              CAHIERS_TEST_EVAL="$js" "./cahiers-$build" > "essais/$nom.log" 2>&1 &
              pid=$!
              sleep 35
              screencapture -x "essais/$nom.png" || true
              {
                echo "== $nom"
                osascript -e "tell application \"System Events\" to tell (first process whose unix id is $pid) to get {name of every window, count of sheets of every window}" 2>&1
              } | tee -a resultats.txt
              kill "$pid" 2>/dev/null || true
              sleep 3
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: essai-impression-mac
          path: |
            resultats.txt
            essais/
