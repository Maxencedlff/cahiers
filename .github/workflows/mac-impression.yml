# Essai a la main (Actions, « Essai impression Mac », Run workflow) ou a
# chaque envoi sur une branche fix-impression-* : l'export PDF ouvre-t-il la
# boite d'impression sur un vrai Mac ?
# Applis de debug (.app), lancees sur la machine de GitHub ; CAHIERS_TEST_EVAL
# rejoue 15 s apres le demarrage le parcours de .github/essai-export.js
# (nouvelle matiere, une ligne, Partager, Exporter), puis captures d'ecran.
#  - « nouveau » : window.print de l'appli (commande print_page, print.rs) ;
#  - « ancien » : l'impression de Tauri (plugin:webview|print, wry), celle
#    de la 0.2.1 refusee par App Review.
# Chacun en appli directe et en appli App Store (feature app-store, config
# MAS, sandbox signee ad hoc avec les entitlements de l'App Store).
name: Essai impression Mac
on:
  workflow_dispatch:
  # Un workflow manuel n'apparait qu'une fois sur main : d'ici la, il part a
  # chaque envoi sur une branche de correction d'impression.
  push:
    branches: ["fix-impression-*"]

permissions:
  contents: read

jobs:
  impression:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri
          key: mac-impression
      - name: Applis de debug (directe, App Store)
        run: |
          # Sans les fichiers de mise a jour (ils exigent la cle privee de
          # l'updater, absente ici).
          echo '{"bundle":{"createUpdaterArtifacts":false}}' > sans-maj.json
          npx tauri build --debug --bundles app --config sans-maj.json
          mv src-tauri/target/debug/bundle/macos/Cahiers.app direct.app
          # Config MAS sans identite Apple ni profil (absents ici) : signee
          # ad hoc ensuite, avec la sandbox et les entitlements de l'App Store
          # moins ceux qui exigent le profil (application/team identifier).
          echo '{"bundle":{"macOS":{"signingIdentity":null,"files":null}}}' > sans-signature.json
          npx tauri build --debug --bundles app --features app-store \
            --config src-tauri/tauri.appstore.conf.json --config sans-signature.json
          mv src-tauri/target/debug/bundle/macos/Cahiers.app appstore.app
          cp src-tauri/appstore/Entitlements.plist sandbox.plist
          /usr/libexec/PlistBuddy -c "Delete :com.apple.application-identifier" sandbox.plist
          /usr/libexec/PlistBuddy -c "Delete :com.apple.developer.team-identifier" sandbox.plist
          codesign --force --deep -s - --entitlements sandbox.plist appstore.app
          codesign -d --entitlements - appstore.app
      - name: Essais
        run: |
          sw_vers | tee resultats.txt
          mkdir -p essais
          parcours="$(cat .github/essai-export.js)"
          ancien="window.print = () => window.__TAURI_INTERNALS__.invoke('plugin:webview|print');"
          for build in direct appstore; do
            for chemin in nouveau ancien; do
              nom="$build-$chemin"
              if [ "$chemin" = nouveau ]; then js="$parcours"; else js="$ancien $parcours"; fi
              CAHIERS_TEST_EVAL="$js" "./$build.app/Contents/MacOS/cahiers" > "essais/$nom.log" 2>&1 &
              pid=$!
              for t in 30 45 70; do
                sleep $(( t == 30 ? 30 : t == 45 ? 15 : 25 ))
                screencapture -x "essais/$nom-$t.png" || true
              done
              {
                echo "== $nom"
                kill -0 "$pid" 2>/dev/null && echo "en vie" || echo "ARRETEE"
                osascript -e "tell application \"System Events\" to tell (first process whose unix id is $pid) to get {name of every window, count of sheets of every window}" 2>&1
              } | tee -a resultats.txt
              kill "$pid" 2>/dev/null || true
              sleep 3
              log show --last 2m --style compact --predicate 'process == "cahiers"' 2>/dev/null | grep -iE "print|sandbox|deny|error|fault" | tail -40 > "essais/$nom-systeme.log" || true
              rm -rf ~/Library/Application\ Support/fr.mdlf.cahiers ~/Library/Containers/fr.mdlf.cahiers ~/Library/WebKit/fr.mdlf.cahiers 2>/dev/null || true
            done
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: essai-impression-mac
          path: |
            resultats.txt
            essais/
