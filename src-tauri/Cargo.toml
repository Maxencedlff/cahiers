[package]
name = "cahiers"
version = "0.2.2"
description = "Prise de notes stylet pour etudes d'ingenieur"
authors = ["Maxence de La Fouchardiere"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "cahiers_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# Build Mac App Store (job « mas » de build.yml, tauri.appstore.conf.json) :
# appli sandboxee, pas de mise a jour par l'appli (l'App Store s'en charge),
# dossier synchronise retrouve par « security-scoped bookmark » (sandbox.rs).
# Le .dmg Developer ID, Windows et Linux ne l'activent jamais.
app-store = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
# Boite « Enregistrer sous » de l'export Word (save_export).
tauri-plugin-dialog = "2"
# Ouvrir un dossier, montrer un fichier dans l'explorateur ou le Finder
# (NSWorkspace sur Mac, compatible sandbox), ouvrir la politique de
# confidentialite dans le navigateur (shell.rs). Fonctions Rust seulement :
# aucune permission « opener » n'est donnee au frontend.
tauri-plugin-opener = "2.7"
# Mises a jour : verifie latest.json sur cahiers-releases (signature minisign),
# telecharge, installe ; process relance l'appli ensuite.
tauri-plugin-updater = "2.14"
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
base64 = "0.22"

# Mac : security-scoped bookmarks (sandbox.rs, build Mac App Store) et
# impression de la page (print.rs, toutes les builds Mac). Memes versions
# que celles que tauri tire deja (Cargo.lock).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSArray",
  "NSData",
  "NSError",
  "NSGeometry",
  "NSString",
  "NSURL",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-core-foundation",
  "NSPrintInfo",
  "NSPrintOperation",
  "NSResponder",
  "NSView",
  "NSWindow",
] }
objc2-web-kit = { version = "0.3", default-features = false, features = [
  "std",
  "objc2-app-kit",
  "WKWebView",
] }

# OCR local, fourni par Windows (section 6) : pas de service externe.
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Media_Ocr",
  "Graphics_Imaging",
  "Storage_Streams",
  "Globalization",
  "Foundation_Collections",
  # Renommage sans ecrasement (MoveFileExW) et nom de la machine.
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  "Win32_System_SystemInformation",
]

[profile.release]
# Une application d'encre doit demarrer vite et tenir peu de place.
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
